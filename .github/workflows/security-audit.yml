name: Security audit

on:
  pull_request:
    branches: [master]
    paths:
      - Cargo.toml
      - Cargo.lock
      - prototypes/ascii-organism/Cargo.toml
      - prototypes/ascii-organism/Cargo.lock
      - .github/workflows/security-audit.yml
  push:
    branches: [master]
    paths:
      - Cargo.toml
      - Cargo.lock
      - prototypes/ascii-organism/Cargo.toml
      - prototypes/ascii-organism/Cargo.lock
      - .github/workflows/security-audit.yml
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_AUDIT_VERSION: "0.22.2"

jobs:
  audit:
    name: RustSec
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable

      - name: Cache cargo-audit build data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/cargo-audit-target
          key: cargo-audit-${{ env.CARGO_AUDIT_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install the pinned cargo-audit version
        shell: bash
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR="$HOME/.cache/cargo-audit-target" \
            cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" \
            --locked --force
          cargo audit --version | grep -Eq \
            "[[:space:]]${CARGO_AUDIT_VERSION}$"

      - name: Audit both locked dependency graphs
        run: |
          cargo audit --file Cargo.lock
          cargo audit --file prototypes/ascii-organism/Cargo.lock
