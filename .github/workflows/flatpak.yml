name: Flatpak

on:
  pull_request:
    branches: [master]
    paths:
      - Cargo.lock
      - Cargo.toml
      - 'LICENSE*'
      - data/**
      - packaging/flatpak/**
      - scripts/install-workflow-assets.sh
      - scripts/workflows/**
      - scripts/update-flatpak-cargo-sources.sh
      - scripts/smoke-flatpak.sh
      - src/**
      - .github/workflows/flatpak.yml
  push:
    branches: [master]
    paths:
      - Cargo.lock
      - Cargo.toml
      - 'LICENSE*'
      - data/**
      - packaging/flatpak/**
      - scripts/install-workflow-assets.sh
      - scripts/workflows/**
      - scripts/update-flatpak-cargo-sources.sh
      - scripts/smoke-flatpak.sh
      - src/**
      - .github/workflows/flatpak.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flatpak-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  APP_ID: io.github.beamiter.forge

jobs:
  build:
    name: Bundle and smoke-test
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            appstream \
            dbus-x11 \
            desktop-file-utils \
            elfutils \
            flatpak \
            flatpak-builder \
            librsvg2-bin \
            librsvg2-common \
            python3-venv \
            weston \
            xvfb

      - name: Enable full AppStream compose diagnostics
        run: |
          mkdir -p "${RUNNER_TEMP}/forge-ci-bin"
          cat > "${RUNNER_TEMP}/forge-ci-bin/appstreamcli" <<'EOF'
          #!/bin/sh
          if [ "${1:-}" = "compose" ]; then
            shift
            exec /usr/bin/appstreamcli compose --print-report=full "$@"
          fi
          exec /usr/bin/appstreamcli "$@"
          EOF
          chmod 0755 "${RUNNER_TEMP}/forge-ci-bin/appstreamcli"
          echo "${RUNNER_TEMP}/forge-ci-bin" >> "${GITHUB_PATH}"

      - name: Verify generated Cargo sources
        id: cargo_sources
        continue-on-error: true
        run: |
          set -o pipefail
          {
            scripts/update-flatpak-cargo-sources.sh --check \
              --output /tmp/cargo-sources.json
          } 2>&1 | tee cargo-sources-verify.log

      - name: Stage generated Cargo source manifest
        if: ${{ always() }}
        run: |
          if [[ -f /tmp/cargo-sources.json ]]; then
            cp /tmp/cargo-sources.json generated-cargo-sources.json
          fi

      - name: Upload Cargo source diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cargo-sources-diagnostics-${{ github.run_id }}
          path: |
            cargo-sources-verify.log
            generated-cargo-sources.json
          if-no-files-found: error
          retention-days: 1

      - name: Require generated Cargo sources
        if: ${{ steps.cargo_sources.outcome == 'failure' }}
        run: exit 1

      - name: Validate desktop metadata and icons
        run: |
          desktop-file-validate "data/${APP_ID}.desktop"
          appstreamcli validate --no-net "data/${APP_ID}.metainfo.xml"
          rsvg-convert -w 128 -h 128 "data/${APP_ID}.svg" > /tmp/icon-128.png
          rsvg-convert -w 256 -h 256 "data/${APP_ID}.svg" > /tmp/icon-256.png
          cmp "data/${APP_ID}-128.png" /tmp/icon-128.png
          cmp "data/${APP_ID}-256.png" /tmp/icon-256.png

      - name: Configure Flathub
        run: |
          flatpak --user remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build Flatpak repository
        id: flatpak_build
        continue-on-error: true
        run: |
          set -o pipefail
          {
            flatpak-builder --user --install-deps-from=flathub --force-clean \
              --disable-rofiles-fuse --repo=flatpak-repo flatpak-build \
              "packaging/flatpak/${APP_ID}.yml"
            flatpak build-bundle flatpak-repo "${APP_ID}.flatpak" "${APP_ID}"
            sha256sum "${APP_ID}.flatpak" | tee "${APP_ID}.flatpak.sha256"
          } 2>&1 | tee flatpak-build.log

      - name: Upload Flatpak build diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: flatpak-build-diagnostics-${{ github.run_id }}
          path: flatpak-build.log
          if-no-files-found: warn
          retention-days: 1

      - name: Require Flatpak build
        if: ${{ steps.flatpak_build.outcome == 'failure' }}
        run: exit 1

      - name: Install local bundle
        id: flatpak_install
        continue-on-error: true
        run: |
          set -o pipefail
          {
            flatpak --user remote-add --if-not-exists --no-gpg-verify \
              forge-ci "file://${PWD}/flatpak-repo"
            flatpak --user install -y forge-ci "${APP_ID}"
            flatpak run --command=sh "${APP_ID}" -c \
              'test -s /app/share/licenses/io.github.beamiter.forge/LICENSE-MIT && test -s /app/share/licenses/io.github.beamiter.forge/LICENSE-APACHE'
            flatpak run "${APP_ID}" --version
            # The Flatpak host bridge uses flatpak-spawn over the session bus.
            # Run headless diagnostics inside a bus even when no display exists.
            dbus-run-session -- flatpak run "${APP_ID}" --doctor
          } 2>&1 | tee flatpak-install.log

      - name: Upload Flatpak install diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: flatpak-install-diagnostics-${{ github.run_id }}
          path: flatpak-install.log
          if-no-files-found: error
          retention-days: 1

      - name: Require local bundle install
        if: ${{ steps.flatpak_install.outcome == 'failure' }}
        run: exit 1

      - name: Smoke-test X11 and Wayland launches
        run: dbus-run-session -- scripts/smoke-flatpak.sh "${APP_ID}"

      - name: Upload Flatpak bundle and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: forge-flatpak-${{ github.sha }}
          path: |
            io.github.beamiter.forge.flatpak
            io.github.beamiter.forge.flatpak.sha256
            cargo-sources-verify.log
            flatpak-build.log
            flatpak-install.log
            flatpak-smoke-logs/
          if-no-files-found: warn
          retention-days: 7
