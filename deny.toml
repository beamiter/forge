[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[advisories]
version = 2

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
  "https://github.com/beamiter/jagent.git?rev=ab7552d2bf287e330f67f7b75ab766b73aa6268e",
  "https://github.com/beamiter/jterm_core.git?rev=f60c507df59129b281822dd97d2df3a709a02ce4",
]
