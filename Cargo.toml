[package]
name = "forge"
version = "0.2.0"
edition = "2021"
description = "A session-aware GTK4 terminal with structured command blocks"
repository = "https://github.com/beamiter/forge"
readme = "README.md"
license = "MIT OR Apache-2.0"
publish = false
categories = ["command-line-utilities", "development-tools"]
autobins = false

[[bin]]
name = "forge"
path = "src/bin/forge.rs"
test = false
bench = false

[dependencies]
# Pin the shared contract so a branch move cannot silently change a release build.
jterm_core = { git = "https://github.com/beamiter/jterm_core.git", rev = "586d84739c490d74918778a31441040ed7a36a4b" }
jagent = { git = "https://github.com/beamiter/jagent.git", rev = "f3b9b9a95d494619b0e623bd96afa70311f9ca26" }
log = { version = "0.4", features = ["std"] }
crossbeam-channel = "0.5"
dirs = "6.0"
memchr = "2"
nix = { version = "0.31.3", features = ["term", "signal", "process", "ioctl"] }
pcre2-sys = "0.2.10"
toml = "1.1.2"
vte4 = { version = "0.10.0", features = ["v0_76"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.21"
rkyv = { version = "0.8", features = ["bytecheck"] }
bytecheck = { version = "0.8", default-features = false }
zstd = "0.13"
regex = "1"
fuzzy-matcher = "0.3"
serde_yaml = "0.9"
unicode-width = "0.2"
gtk4 = { version = "0.11.4", features = ["v4_14"] }
gdk4 = { version = "0.11.4", features = ["v4_14"] }
libadwaita = { version = "0.9.2", features = ["v1_5"] }

[dev-dependencies]
env_logger = "0.11"

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
