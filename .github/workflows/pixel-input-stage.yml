name: Validate GTK direct pixel input
on:
  push:
    branches: [work/vim9-pixel-input-20261021]
permissions:
  contents: write
concurrency:
  group: native-pixel-candidate
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE: 7ed18b497517d72756450081cfd49fa597b35942
      CORE_REVISION: 338011a4d0bb889df6e4116ac5221b50efca0620
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: beamiter/anvil
          ref: de8986d233cf72ea2a0d6af73317d257089df6b2
          path: .pixel-tooling
          sparse-checkout: .maintenance
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: native-vim-core-upgrade
      - name: Install GTK and real Vim test prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config libgtk-4-dev libadwaita-1-dev libvte-2.91-gtk4-dev libpcre2-dev xvfb dbus-x11 vim-nox ripgrep > /tmp/deps.log 2>&1 || { tail -60 /tmp/deps.log; exit 1; }
      - run: |
          python3 .pixel-tooling/.maintenance/apply-pixel-gtk.py
          python3 .pixel-tooling/.maintenance/refine-pixel-gtk.py
      - run: cargo fmt --all && git diff --check
      - run: cargo check --quiet --locked --all-targets
      - run: cargo test --quiet --locked vim9 -- --test-threads=1
      - name: Actual GTK snapshot and pixel-source coordinates
        run: dbus-run-session -- xvfb-run -a cargo test --quiet --locked native_pixel_snapshot_and_source_hit_round_trip -- --ignored --test-threads=1
      - name: Prepare clean tested candidate without moving master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          repo, base = os.environ['GITHUB_REPOSITORY'], os.environ['BASE']
          def req(path, data=None):
              r = urllib.request.Request('https://api.github.com/repos/' + repo + path,
                  data=None if data is None else json.dumps(data).encode(), headers={
                  'Authorization':'Bearer ' + os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json',
                  'Content-Type':'application/json'})
              with urllib.request.urlopen(r, timeout=60) as response: return json.load(response)
          if req('/git/ref/heads/master')['object']['sha'] != base: raise SystemExit('master advanced')
          paths = ['Cargo.toml','Cargo.lock','src/vim9_ide_buffer.rs']
          entries = []
          for path in paths:
              blob = req('/git/blobs', {'content':Path(path).read_text(),'encoding':'utf-8'})
              entries.append({'path':path,'mode':'100644','type':'blob','sha':blob['sha']})
          tree = req('/git/trees', {'base_tree':req('/git/commits/' + base)['tree']['sha'],'tree':entries})
          commit = req('/git/commits', {'message':'feat(vim9): connect direct precision pixels, source hits and native drag selection',
              'tree':tree['sha'],'parents':[base]})
          print('::notice title=GTK pixel candidate::' + json.dumps({'base':base,'candidate':commit['sha'],'tree':tree['sha'],'files':entries}))
          PY
