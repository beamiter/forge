[package]
name = "forge-ascii-organism"
version = "0.1.0"
edition = "2021"
description = "No-LLM ASCII organism vertical prototype for Forge"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
crossterm = "0.29.0"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-width = "0.2"

[profile.release]
lto = "thin"
strip = "symbols"
