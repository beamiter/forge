name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  CARGO_DENY_VERSION: "0.20.2"

jobs:
  privacy:
    name: Tracked-text privacy guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Reject known personal identifiers
        run: ./scripts/privacy-check.sh

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable

      - name: Install cargo-deny
        run: >-
          cargo install cargo-deny --version "$CARGO_DENY_VERSION"
          --locked --force

      - name: Enforce dependency policy
        run: scripts/security-check.sh --policy

  fmt:
    name: Rustfmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          components: rustfmt

      - name: Check Files follow callback races
        run: python3 scripts/test-files-follow.py

      - name: Check search callback lifecycle
        run: python3 scripts/test-search-lifecycle.py

      - name: Check pane focus and zoom lifecycle
        run: python3 scripts/test-pane-lifecycle.py

      - name: Check bidirectional tab selection
        run: python3 scripts/test-tab-selection.py

      - name: Check PTY resize errors against native Linux PTYs
        run: python3 scripts/test-pty-resize.py

      - name: Check formatting
        id: fmt
        run: cargo fmt --all -- --check

      - name: Generate formatting patch
        if: ${{ failure() && steps.fmt.conclusion == 'failure' }}
        run: |
          cargo fmt --all
          git diff -- . > rustfmt.patch

      - name: Upload formatting diagnostics
        if: ${{ failure() && steps.fmt.conclusion == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: rustfmt-diagnostics
          path: rustfmt.patch
          if-no-files-found: error
          retention-days: 1

  shell:
    name: Shell scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y shellcheck

      - name: Check Bash integration locale and native readline
        run: python3 scripts/test-bash-integration-locale.py

      - name: Check Bash OSC transport and redirected bytes
        run: python3 scripts/test-bash-osc-transport.py

      - name: Check bounded Bash command metadata
        run: python3 scripts/test-bash-command-metadata.py

      - name: Check tracked shell scripts
        run: |
          set -euo pipefail
          scripts/security-check.sh --shell
          scripts/install.sh --help >/dev/null
          scripts/uninstall.sh --help >/dev/null
          bash scripts/test-install-paths.sh
          bash scripts/test-release-assets.sh

  gtk-display:
    name: GTK display regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install GTK display test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config \
            libgtk-4-dev \
            libadwaita-1-dev \
            libvte-2.91-gtk4-dev \
            libpcre2-dev \
            xvfb \
            xdotool \
            xauth \
            libxtst6 \
            python3 \
            gdb \
            dbus-x11 \
            sway \
            wtype \
            grim \
            fonts-dejavu-core \
            fonts-liberation \
            fonts-noto-cjk \
            fonts-noto-color-emoji

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          shared-key: gtk-display

      - name: Check PTY input rejection and native delivery
        run: |
          cargo fetch --locked
          python3 scripts/test-pty-input.py

      - name: Check font sizing against native Pango
        run: python3 scripts/test-font-sync.py

      - name: Check F13 native fractional-scale Chat rendering
        run: |
          python3 scripts/test-chat-render-oracles.py
          python3 scripts/test-chat-render-matrix.py

      - name: Check F13 real Bash keyboard and clipboard smoke
        run: |
          python3 scripts/test-chat-shell-oracles.py
          python3 scripts/test-chat-shell-smoke.py

      - name: Check F13 history-enabled same-execution metadata
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/test-chat-metadata-oracles.py
          python3 scripts/test-chat-shell-smoke.py --metadata --output gtk-paint-diagnostics/f13-metadata

      - name: Check historical command provenance labels
        if: ${{ !cancelled() }}
        run: |
          set -Eeuo pipefail
          test_name=block_view::blocks::command_reuse_labels_tests::recall_header_describes_insert_only_action
          listed_tests="$(cargo test --lib --all-features --locked -- --ignored --list)"
          grep -Fqx -- "${test_name}: test" <<<"${listed_tests}"
          test_xdg_root="$(mktemp -d)"
          trap 'rm -rf -- "$test_xdg_root"' EXIT
          mkdir -p "$test_xdg_root"/{config,data,state,cache,runtime}
          chmod 700 "$test_xdg_root/runtime"
          export XDG_CONFIG_HOME="$test_xdg_root/config"
          export XDG_DATA_HOME="$test_xdg_root/data"
          export XDG_STATE_HOME="$test_xdg_root/state"
          export XDG_CACHE_HOME="$test_xdg_root/cache"
          export XDG_RUNTIME_DIR="$test_xdg_root/runtime"
          export RUST_TEST_THREADS=1 GDK_BACKEND=x11 GSK_RENDERER=cairo
          export LIBGL_ALWAYS_SOFTWARE=1 NO_AT_BRIDGE=1 GTK_A11Y=none
          dbus-run-session -- \
            xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
            cargo test --lib --all-features --locked "$test_name" -- \
            --ignored --exact --nocapture

      - name: Check independent native font groups
        if: ${{ !cancelled() }}
        run: |
          set -Eeuo pipefail
          test_name=block_view::font_sync_tests::font_groups_stay_independent_across_native_panes_and_late_rows
          listed_tests="$(cargo test --lib --all-features --locked -- --ignored --list)"
          grep -Fqx -- "${test_name}: test" <<<"${listed_tests}"
          test_xdg_root="$(mktemp -d)"
          trap 'rm -rf -- "$test_xdg_root"' EXIT
          mkdir -p "$test_xdg_root"/{config,data,state,cache,runtime}
          chmod 700 "$test_xdg_root/runtime"
          export XDG_CONFIG_HOME="$test_xdg_root/config"
          export XDG_DATA_HOME="$test_xdg_root/data"
          export XDG_STATE_HOME="$test_xdg_root/state"
          export XDG_CACHE_HOME="$test_xdg_root/cache"
          export XDG_RUNTIME_DIR="$test_xdg_root/runtime"
          export RUST_TEST_THREADS=1 GDK_BACKEND=x11 GSK_RENDERER=cairo
          export LIBGL_ALWAYS_SOFTWARE=1 NO_AT_BRIDGE=1 GTK_A11Y=none
          dbus-run-session -- \
            xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
            cargo test --lib --all-features --locked "$test_name" -- \
            --ignored --exact --nocapture

      - name: Check production top-tab geometry extremes
        if: ${{ !cancelled() }}
        run: |
          set -Eeuo pipefail
          python3 scripts/check-tab-geometry-shape.py
          mkdir -p gtk-paint-diagnostics
          test_name=ui::tab_geometry_tests::production_top_tabs_bound_viewport_minimum_across_font_extremes
          listed_tests="$(cargo test --lib --all-features --locked -- --ignored --list)"
          grep -Fqx -- "${test_name}: test" <<<"${listed_tests}"
          test_xdg_root="$(mktemp -d)"
          trap 'rm -rf -- "$test_xdg_root"' EXIT
          mkdir -p "$test_xdg_root"/{config,data,state,cache,runtime}
          chmod 700 "$test_xdg_root/runtime"
          export XDG_CONFIG_HOME="$test_xdg_root/config"
          export XDG_DATA_HOME="$test_xdg_root/data"
          export XDG_STATE_HOME="$test_xdg_root/state"
          export XDG_CACHE_HOME="$test_xdg_root/cache"
          export XDG_RUNTIME_DIR="$test_xdg_root/runtime"
          export RUST_TEST_THREADS=1 GDK_BACKEND=x11 GSK_RENDERER=cairo
          export LIBGL_ALWAYS_SOFTWARE=1 NO_AT_BRIDGE=1 GTK_A11Y=none
          dbus-run-session -- \
            xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
            cargo test --lib --all-features --locked "$test_name" -- \
            --ignored --exact --nocapture 2>&1 | tee gtk-paint-diagnostics/top-tab-geometry.log

      - name: Check exact retained-text search preview
        if: ${{ !cancelled() }}
        run: |
          set -Eeuo pipefail
          python3 scripts/check-search-preview-shape.py
          mkdir -p gtk-paint-diagnostics
          model_tests="$(cargo test --lib --all-features --locked -- --list)"
          grep -Fqx -- 'block_view::search_preview::tests::failed_snapshot_construction_cannot_publish_a_partial_total: test' <<<"$model_tests"
          cargo test --lib --all-features --locked block_view::search_preview::tests:: -- \
            --nocapture 2>&1 | tee gtk-paint-diagnostics/exact-search-preview-model.log
          test_name=ui::search_preview::tests::exact_preview_tags_follow_unicode_ranges_without_native_selection
          listed_tests="$(cargo test --lib --all-features --locked -- --ignored --list)"
          grep -Fqx -- "${test_name}: test" <<<"${listed_tests}"
          test_xdg_root="$(mktemp -d)"
          trap 'rm -rf -- "$test_xdg_root"' EXIT
          mkdir -p "$test_xdg_root"/{config,data,state,cache,runtime}
          chmod 700 "$test_xdg_root/runtime"
          export XDG_CONFIG_HOME="$test_xdg_root/config"
          export XDG_DATA_HOME="$test_xdg_root/data"
          export XDG_STATE_HOME="$test_xdg_root/state"
          export XDG_CACHE_HOME="$test_xdg_root/cache"
          export XDG_RUNTIME_DIR="$test_xdg_root/runtime"
          export RUST_TEST_THREADS=1 GDK_BACKEND=x11 GSK_RENDERER=cairo
          export LIBGL_ALWAYS_SOFTWARE=1 NO_AT_BRIDGE=1 GTK_A11Y=none
          dbus-run-session -- \
            xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
            cargo test --lib --all-features --locked "$test_name" -- \
            --ignored --exact --nocapture 2>&1 | tee gtk-paint-diagnostics/exact-search-preview.log

          test_name=ui::search_preview::dialog_tests::production_dialog_is_frozen_stale_safe_and_primary_neutral
          grep -Fqx -- "${test_name}: test" <<<"${listed_tests}"
          dbus-run-session -- \
            xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -nolisten tcp' \
            cargo test --lib --all-features --locked "$test_name" -- \
            --ignored --exact --nocapture 2>&1 | tee gtk-paint-diagnostics/exact-search-preview-dialog.log

      - name: Run display-backed GTK/VTE regressions
        run: FORGE_NATIVE_CRASH_DIAGNOSTICS=1 GTK_PAINT_DIAGNOSTICS_DIR="$PWD/gtk-paint-diagnostics" FORGE_XTEST_DRIVER="$PWD/scripts/qa-cross-selection-pointer.py" bash scripts/test-gtk-display.sh

      - name: Upload synthetic GTK paint diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: gtk-paint-diagnostics
          path: gtk-paint-diagnostics/
          if-no-files-found: ignore
          retention-days: 7


  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install GTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config \
            libgtk-4-dev \
            libadwaita-1-dev \
            libvte-2.91-gtk4-dev \
            libpcre2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          components: clippy

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          shared-key: clippy

      - name: Run Clippy
        id: clippy
        run: |
          set -o pipefail
          cargo clippy --all-targets --all-features --locked -- -D warnings 2>&1 | tee clippy.log

      - name: Upload Clippy diagnostics
        if: ${{ failure() && steps.clippy.conclusion == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: clippy-diagnostics
          path: clippy.log
          if-no-files-found: error
          retention-days: 1

  rustdoc:
    name: Rustdoc
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install GTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config \
            libgtk-4-dev \
            libadwaita-1-dev \
            libvte-2.91-gtk4-dev \
            libpcre2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          shared-key: rustdoc

      - name: Check documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --all-features --locked

  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install GTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config \
            libgtk-4-dev \
            libadwaita-1-dev \
            libvte-2.91-gtk4-dev \
            libpcre2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          shared-key: tests

      - name: Run tests
        run: cargo test --all-targets --all-features --locked --no-fail-fast

  ascii-organism:
    name: ASCII organism prototype
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: prototypes/ascii-organism
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          components: rustfmt,clippy

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          shared-key: ascii-organism
          workspaces: prototypes/ascii-organism -> target

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --locked --no-fail-fast

  release-build:
    name: Release build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install GTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config \
            libgtk-4-dev \
            libadwaita-1-dev \
            libvte-2.91-gtk4-dev \
            libpcre2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          shared-key: release

      - name: Build release binary
        run: cargo build --release --all-features --locked

      - name: Build and verify relocatable release bundle
        run: |
          bash scripts/package-release.sh target/release/forge
          (cd target/dist && sha256sum --check ./*.sha256)

      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: forge-${{ github.sha }}
          path: target/dist/*
          if-no-files-found: error
          retention-days: 7

  nix:
    name: Nix package
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24  # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Evaluate and build flake checks
        run: nix flake check --no-write-lock-file --print-build-logs
