name: Repeated Open reconciliation validation
on:
  push:
    branches: [diagnostics/forge-open-reconcile]
permissions:
  contents: read
jobs:
  history:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: bash scripts/materialize-shared-core.sh
      - run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pkg-config libgtk-4-dev libadwaita-1-dev libvte-2.91-gtk4-dev libpcre2-dev libxtst6
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt,clippy
      - name: Format and record exact tested source
        run: |
          cargo fmt --all
          python3 - <<'PY'
          import base64, hashlib, subprocess
          from pathlib import Path
          names = ['src/ui/workspace_chats.rs']
          print('FORMAT_PATCH', base64.b64encode(subprocess.check_output(['git', 'diff', '--', *names])).decode())
          for name in names:
              print('TESTED_SHA256', name, hashlib.sha256(Path(name).read_bytes()).hexdigest())
          PY
          cargo fmt --all -- --check
      - name: Clippy and production chat bridge regressions
        run: |
          cargo clippy --lib --all-features --locked -- -D warnings
          cargo test --lib --all-features --locked workspace_chats::tests
      - name: Original Open overwrite negative control must fail
        shell: bash
        run: |
          set -Eeuo pipefail
          file=src/ui/workspace_chats.rs
          cp "$file" "$RUNNER_TEMP/open-fixed.rs"
          trap 'cp "$RUNNER_TEMP/open-fixed.rs" "$file"' EXIT
          python3 - <<'PYCODE'
          from pathlib import Path
          p=Path('src/ui/workspace_chats.rs')
          s=p.read_text()
          start=s.index('    fn receive_open_chat(')
          head=s[:start]
          tail=s[start:]
          old='if let Some(local) = self.local_id(&chat.row.id) {'
          assert old in tail
          p.write_text(head+tail.replace(old,'if let Some(local) = None::<u64> {',1))
          PYCODE
          set +e
          cargo test --lib --all-features --locked ui::workspace_chats::tests::duplicate_open_reply_preserves_draft_typed_between_polls -- --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/open-old.log"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -F 'duplicate Open must preserve newer local draft' "$RUNNER_TEMP/open-old.log"
          grep -F 'baseline' "$RUNNER_TEMP/open-old.log"
          echo "Confirmed original Open overwrites local draft (status $status)"
