app-id: io.github.beamiter.forge
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: forge

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=ssh-auth
  - --device=dri
  - --filesystem=host
  - --talk-name=org.freedesktop.Flatpak
  - --env=FORGE_ASSET_DIR=/app/share/forge
  - --env=FORGE_WORKFLOW_DIR=/app/share/forge/workflows

cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/doc
  - /share/gir-1.0
  - /share/gtk-doc
  - /share/man
  - /share/pkgconfig
  - /share/vala
  - '*.a'
  - '*.la'

modules:
  # Local task worktrees use a private Git binary. Interactive Git still
  # runs in the user's host shell. Use upstream Git's C implementation so
  # this isolated module does not depend on Cargo or a second vendor graph.
  - name: task-git
    buildsystem: simple
    build-commands:
      - make -j${FLATPAK_BUILDER_N_JOBS} prefix=/app gitexecdir=/app/libexec/jterm NO_GETTEXT=1 NO_CURL=1 NO_EXPAT=1 NO_OPENSSL=1 NO_RUST=1 git
      - install -Dm0755 git ${FLATPAK_DEST}/libexec/jterm/git
      - install -Dm0644 COPYING ${FLATPAK_DEST}/share/licenses/task-git/COPYING
    sources:
      - type: archive
        url: https://www.kernel.org/pub/software/scm/git/git-2.56.1.tar.xz
        sha256: f0b0bf89264b9bd2e1c640363e7529643989da76281600473c50745cd34a607f

  - name: forge
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/forge/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo build --offline --release --no-default-features --features shared-terminal --locked
      - install -Dm0755 target/release/forge ${FLATPAK_DEST}/bin/forge
      - install -Dm0755 scripts/support-bundle.sh ${FLATPAK_DEST}/bin/forge-support-bundle
      - install -Dm0644 LICENSE-MIT ${FLATPAK_DEST}/share/licenses/io.github.beamiter.forge/LICENSE-MIT
      - install -Dm0644 LICENSE-APACHE ${FLATPAK_DEST}/share/licenses/io.github.beamiter.forge/LICENSE-APACHE
      - install -Dm0644 data/io.github.beamiter.forge.desktop ${FLATPAK_DEST}/share/applications/io.github.beamiter.forge.desktop
      - install -Dm0644 data/io.github.beamiter.forge.metainfo.xml ${FLATPAK_DEST}/share/metainfo/io.github.beamiter.forge.metainfo.xml
      - install -Dm0644 data/io.github.beamiter.forge.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/io.github.beamiter.forge.svg
      - install -Dm0644 data/io.github.beamiter.forge-128.png ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps/io.github.beamiter.forge.png
      - install -Dm0644 data/io.github.beamiter.forge-256.png ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/io.github.beamiter.forge.png
      - install -Dm0644 scripts/shell-integration/README.md ${FLATPAK_DEST}/share/forge/shell-integration/README.md
      - install -Dm0644 scripts/shell-integration/forge.bash ${FLATPAK_DEST}/share/forge/shell-integration/forge.bash
      - install -Dm0644 scripts/shell-integration/forge.zsh ${FLATPAK_DEST}/share/forge/shell-integration/forge.zsh
      - install -Dm0644 scripts/shell-integration/forge.fish ${FLATPAK_DEST}/share/forge/shell-integration/forge.fish
      - install -Dm0644 scripts/shell-integration/forge.ps1 ${FLATPAK_DEST}/share/forge/shell-integration/forge.ps1
      - bash scripts/install-workflow-assets.sh scripts/workflows ${FLATPAK_DEST}/share/forge/workflows
      - install -Dm0644 scripts/notebooks/welcome.jtnb.md ${FLATPAK_DEST}/share/forge/notebooks/welcome.jtnb.md
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - .flatpak-builder
          - flatpak-build
          - flatpak-repo
          - target
      - cargo-sources.json
