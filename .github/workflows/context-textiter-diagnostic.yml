name: Context TextIter candidate validation
on:
  push:
    branches: [diagnostics/forge-context-textiter]
permissions:
  contents: read
jobs:
  context:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: '0'
      GDK_BACKEND: x11
      GSK_RENDERER: cairo
      GTK_A11Y: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: bash scripts/materialize-shared-core.sh
      - run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pkg-config libgtk-4-dev libadwaita-1-dev libvte-2.91-gtk4-dev libpcre2-dev xvfb xauth dbus-x11 libxtst6
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt,clippy
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Check all production code and models
        if: ${{ !cancelled() }}
        run: |
          cargo clippy --lib --all-features --locked -- -D warnings
          cargo test --lib --all-features --locked workspace_context::tests
      - name: Context GTK regression with fatal warnings
        if: ${{ !cancelled() }}
        run: |
          G_DEBUG=fatal-warnings dbus-run-session -- xvfb-run --auto-servernum cargo test --lib --all-features --locked ui::workspace_context_ui::tests::rejected_context_paste_restores_field_and_material_buffers -- --ignored --exact --nocapture
      - name: Negative control rejects the known iterator warning
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -Eeuo pipefail
          file=src/ui/workspace_context_ui.rs
          cp "$file" "$RUNNER_TEMP/context-ui-fixed.rs"
          trap 'cp "$RUNNER_TEMP/context-ui-fixed.rs" "$file"' EXIT
          git fetch --no-tags origin 74e6c454883b592b7339e4af86d680b9321fdbad
          git show 74e6c454883b592b7339e4af86d680b9321fdbad:"$file" > "$file"
          set +e
          G_DEBUG=fatal-warnings dbus-run-session -- xvfb-run --auto-servernum cargo test --lib --all-features --locked ui::workspace_context_ui::tests::rejected_context_paste_restores_field_and_material_buffers -- --ignored --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/context-negative.log"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -F 'Invalid text buffer iterator' "$RUNNER_TEMP/context-negative.log"
          echo "Confirmed old implementation fails the fatal-warning gate (status $status)"
      - name: Script contracts
        if: ${{ !cancelled() }}
        run: python3 scripts/test-gtk-display-contract.py
