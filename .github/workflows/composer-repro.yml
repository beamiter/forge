name: Composer TextIter reproduction
on:
  push:
    branches: [diagnostics/forge-composer-limit-repro]
permissions:
  contents: read
jobs:
  context:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: '0'
      GDK_BACKEND: x11
      GSK_RENDERER: cairo
      GTK_A11Y: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: bash scripts/materialize-shared-core.sh
      - run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pkg-config libgtk-4-dev libadwaita-1-dev libvte-2.91-gtk4-dev libpcre2-dev xvfb xauth dbus-x11 libxtst6
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt,clippy
      - name: Old composer must reproduce invalid iterator
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          GTK_IM_MODULE=simple G_DEBUG=fatal-warnings dbus-run-session -- xvfb-run --auto-servernum cargo test --lib --all-features --locked ui::ai_panel::tests::composer_limit_preserves_insert_iter_and_utf8_draft -- --ignored --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/composer-old.log"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -F 'Invalid text buffer iterator' "$RUNNER_TEMP/composer-old.log"
          echo "Confirmed old composer iterator failure (status $status)"
