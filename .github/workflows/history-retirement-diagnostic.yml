name: Earlier history retirement validation
on:
  push:
    branches: [diagnostics/forge-history-retirement]
permissions:
  contents: read
jobs:
  history:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: bash scripts/materialize-shared-core.sh
      - run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pkg-config libgtk-4-dev libadwaita-1-dev libvte-2.91-gtk4-dev libpcre2-dev libxtst6
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt,clippy
      - name: Format and record exact tested source
        run: |
          cargo fmt --all
          python3 - <<'PY'
          import base64, hashlib, subprocess
          from pathlib import Path
          names = ['src/ui/workspace_chats.rs', 'src/ui/ai_panel.rs']
          print('FORMAT_PATCH', base64.b64encode(subprocess.check_output(['git', 'diff', '--', *names])).decode())
          for name in names:
              print('TESTED_SHA256', name, hashlib.sha256(Path(name).read_bytes()).hexdigest())
          PY
          cargo fmt --all -- --check
      - name: Clippy and production chat bridge regressions
        run: |
          cargo clippy --lib --all-features --locked -- -D warnings
          cargo test --lib --all-features --locked workspace_chats::tests
      - name: Missing retirement negative control must fail
        shell: bash
        run: |
          set -Eeuo pipefail
          file=src/ui/workspace_chats.rs
          cp "$file" "$RUNNER_TEMP/history-fixed.rs"
          trap 'cp "$RUNNER_TEMP/history-fixed.rs" "$file"' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/ui/workspace_chats.rs')
          s = p.read_text()
          old = '                self.retire_history(id);'
          assert s.count(old) == 1
          p.write_text(s.replace(old, '                // Negative control: old eviction left pagination state intact.'))
          PY
          set +e
          cargo test --lib --all-features --locked ui::workspace_chats::tests::evicted_history_retires_cursors_and_late_replies_before_repriming -- --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/history-control.log"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -F 'assertion failed: !bridge.history_cursor.contains_key(&evicted)' "$RUNNER_TEMP/history-control.log"
          echo "Confirmed missing retirement retains an invalid cursor (status $status)"
